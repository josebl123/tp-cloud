q:
  # Next chooses 3001 when 3000 is already occupied; permit either local dev origin.
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
  realtime:
    mode: POSTGRES
  notifications:
    email:
      enabled: true
  seed:
    enabled: true

logging:
  level:
    ar.edu.itba.cloud.queue: DEBUG
    org.hibernate.SQL: DEBUG
