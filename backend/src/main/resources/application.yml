spring:
  config:
    # A `.env` is valid .properties syntax, so Spring can read it natively - no library, no export.
    # Both are optional: the application still starts without them, falling back to the defaults below,
    # which is what tests and CI rely on. Values found here win over those defaults.
    #   ./.env               local development, next to where the process runs
    #   /etc/queue/queue.env the deployed instance
    import:
      - optional:file:./.env[.properties]
      - optional:file:/etc/queue/queue.env[.properties]

  application:
    name: queue-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/qdb}
    username: ${DB_USER:q}
    password: ${DB_PASSWORD:q}
    hikari:
      # Sized for a small RDS instance shared by several application instances. Each instance also
      # holds one connection outside this pool for LISTEN/NOTIFY.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 10000
      # Recycle below the idle timeouts a managed database or NAT gateway may impose.
      max-lifetime: 1500000
      keepalive-time: 300000
      pool-name: q-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.query.in_clause_parameter_padding: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # Defaults point at Mailpit, which wants no credentials. A real provider needs all four.
    # Gmail: smtp.gmail.com / 587 / auth and starttls true, with a 16-character App Password.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          # Delivery runs after commit while holding a database connection. Without these an
          # unreachable SMTP host would block that thread and that connection until the OS gave up.
          connectiontimeout: ${MAIL_TIMEOUT_MS:5000}
          timeout: ${MAIL_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_TIMEOUT_MS:5000}
  jackson:
    default-property-inclusion: non_null
  messages:
    # Customer-facing notification copy. The default bundle is English; _es adds Spanish.
    basename: i18n/notifications
    encoding: UTF-8
    # Never fall back to the server's own locale - that would make the language depend on the host.
    fallback-to-system-locale: false
    always-use-message-format: true
  threads:
    virtual:
      enabled: true
  lifecycle:
    # Long enough to finish in-flight work, short enough not to stall an Auto Scaling Group
    # terminating the instance. Live streams are closed before this wait begins.
    timeout-per-shutdown-phase: 25s

server:
  port: ${PORT:8080}
  error:
    include-message: never
  # Finish in-flight requests instead of cutting them off when an instance is being replaced.
  shutdown: graceful
  # Behind a load balancer and a CDN, X-Forwarded-* carries the real scheme, host and client address.
  # Without this the application believes every request arrived over plain HTTP from the proxy.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        # `metrics` carries q.sse.connections, the count of open streams this instance is holding, which
        # is what the Auto Scaling metric has to be calibrated against. SecurityConfig leaves only
        # /actuator/health and /actuator/info public, so reading it needs a staff token.
        include: health,info,metrics
  health:
    # Notification delivery is deliberately non-fatal: a failed send is recorded on the row and never
    # propagated, because a broken mail server must not undo a legitimate queue movement. Health has
    # to agree. Left on, an unreachable SMTP host would report the instance DOWN and let the load
    # balancer deregister a fleet that is serving queues perfectly well.
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # What the load balancer polls. Includes the database on purpose: an instance that cannot
        # reach the database cannot serve, and should be taken out of rotation rather than return
        # errors. Instance replacement is driven by EC2 status checks, not by this, so a database
        # blip degrades the service instead of destroying the fleet.
        readiness:
          include: readinessState,db
        # What proves the process itself is alive. Deliberately excludes the database.
        liveness:
          include: livenessState

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    ar.edu.itba.cloud.queue: INFO

q:
  # Base URL of the SPA. QR codes and ticket links point here.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  jwt:
    # Override in every non-local environment. Must be at least 32 bytes for HS256.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: q-api
    ttl: 12h
  estimation:
    # Number of most recent completed services averaged into the ETA.
    service-time-samples: 10
  grace:
    sweep-interval: 10s
  sse:
    timeout: 30m
    heartbeat-interval: 20s
  notifications:
    email:
      enabled: ${NOTIFY_EMAIL_ENABLED:false}
      from: ${NOTIFY_EMAIL_FROM:no-reply@q.local}
